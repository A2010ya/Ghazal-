['كيف يسهم عتاب القلب في الكشف عن التجربة العاطفية للشاعر؟','يبرز صراع الشاعر مع عاطفته وآثار الهوى فيه',['يبرز صراع الشاعر مع عاطفته وآثار الهوى فيه','يثبت أن القصيدة خالية من العاطفة','يدل على أن القصيدة في وصف الحرب','يؤكد أن القصيدة في مدح الملوك'],'يصور الشاعر صراعًا مع الحب ويحمّل قلبه جانبًا من المسؤولية عن معاناته.']]}
];
const colors=['#de778f','#59ba93','#79b5eb','#e2b65c','#a58cde','#ec9e75'];let state={page:'home',teams:[],teamCount:4,seconds:30,sound:true,stage:0,turn:0,questions:[],answered:false,selected:null,remaining:30,paused:false,showFeedback:false,history:[]},tick=null,audioCtx=null;
const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const shuffle=a=>{let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
function sound(freq=550,dur=.15){if(!state.sound)return;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.frequency.value=freq;o.type='sine';g.gain.setValueAtTime(.07,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);o.start();o.stop(audioCtx.currentTime+dur)}catch(e){}}
function toggleSound(){state.sound=!state.sound; $('audio').textContent=state.sound?'🔊 الصوت: يعمل':'🔇 الصوت: مغلق'}function toggleFullscreen(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.().catch(()=>{});else document.exitFullscreen?.()}
function save(){try{localStorage.setItem('jawahirGameState',JSON.stringify({...state,remaining:state.remaining}))}catch(e){}}function restore(){try{let s=JSON.parse(localStorage.getItem('jawahirGameState'));if(s&&s.teams?.length&&s.questions?.length){state={...state,...s,paused:true,showFeedback:s.showFeedback||false};return true}}catch(e){}return false}
function header(title,sub=''){return `<section class="panel center"><h2>${title}</h2><div class="muted">${sub}</div></section>`}function scores(){return `<div class="scorebar">${state.teams.map((t,i)=>`<div class="score ${state.turn%state.teams.length===i?'active':''}"><span style="color:${t.color}">●</span> ${esc(t.name)} <b>${t.score}</b> نقطة</div>`).join('')}</div>`}
function render(){clearInterval(tick);let html='';if(state.page==='home'){html=`<section class="hero center"><div class="arch"></div><h1>💎 جواهر الغزل الحضري</h1><h2>أسرار قصر الشعراء</h2><p>خمس جواهر، خمس قاعات، ومغامرة أدبية مدهشة!</p><button class="btn" onclick="setup()">🚪 دخول القصر</button> ${localStorage.getItem('jawahirGameState')?'<button class="btn secondary" onclick="continueGame()">استئناف مباراة محفوظة</button>':''}</section>${header('طريقة اللعب','تتناوب المجموعات على لمس الشاشة. لكل مجموعة سؤال واحد في كل جولة، وتجمع النقاط حتى فتح الجواهر الخمس.')}`}
else if(state.page==='setup'){html=`<section class="panel"><h2>⚙️ تجهيز المنافسة</h2><div class="grid"><label class="field">عدد المجموعات<select id="cnt" onchange="setCount(this.value)">${[2,3,4,5,6].map(n=>`<option ${n===state.teamCount?'selected':''} value="${n}">${n} مجموعات</option>`)}</select></label><label class="field">وقت الإجابة<select id="secs" onchange="state.seconds=+this.value"><option value="20">20 ثانية</option><option value="30" ${state.seconds===30?'selected':''}>30 ثانية</option><option value="45">45 ثانية</option><option value="60">60 ثانية</option><option value="0">بدون مؤقت</option></select></label></div><h3>أسماء المجموعات</h3><div id="teamfields">${teamFields()}</div><div class="centerbtn"><button class="btn" onclick="start()">✨ ابدئي المغامرة</button><button class="btn ghost" onclick="goHome()">عودة</button></div></section>`}
else if(state.page==='map'){let stage=state.stage;html=`${header('🕌 خريطة قصر الشعراء','اختاري الجوهرة المضيئة لبدء القاعة التالية')}${scores()}<div class="map">${stages.map((s,i)=>`<button class="gem ${i<stage?'done':i>stage?'locked':''}" ${i!==stage?'disabled':''} onclick="openStage()"><span class="gemIcon">${s.icon}</span><strong>${s.name}</strong><small>${i<stage?'✓ مكتملة':i===stage?'المسي للدخول':'🔒 مغلقة'}</small></button>`).join('')}</div><div class="center muted">${stage<5?'القاعة التالية: '+stages[stage].room:'اكتملت كل القاعات!'}</div><div class="centerbtn"><button class="btn secondary" onclick="pauseGame()">⏸ إيقاف مؤقت</button><button class="btn ghost" onclick="newGame()">مباراة جديدة</button></div>`}
else if(state.page==='question'){const s=stages[state.stage],team=state.teams[state.turn%state.teams.length],entry=state.questions[state.stage][state.turn],q=entry.q;html=`<div class="centerbtn"><span class="tag">${s.icon} ${s.name} | ${s.room}</span><span class="tag">السؤال ${state.turn+1} من ${state.teams.length}</span></div>${scores()}<section class="panel question"><div class="center muted">دور مجموعة <b style="color:${team.color}">${esc(team.name)}</b></div>${state.seconds?`<div class="center" id="count">⏳ ${state.remaining} ثانية</div><div class="timer"><span id="bar" style="width:${state.remaining/state.seconds*100}%"></span></div>`:''}<h2>${esc(q[0])}</h2><div class="choices">${entry.options.map((o,i)=>`<button id="opt${i}" class="choice ${state.answered?(o===entry.q[1]?'correct':i===state.selected?'wrong':''):state.selected===i?'selected':''}" onclick="chooseAnswer(${i})" ${state.answered?'disabled':''} aria-pressed="${state.selected===i}">${esc(o)}</button>`).join('')}</div><div id="response">${state.showFeedback?feedbackHTML():`<div class="centerbtn"><button id="confirmAnswer" class="btn" onclick="answer(state.selected)" ${state.selected===null?'disabled':''}>✅ تأكيد الإجابة المختارة</button></div><p id="selectionHint" class="center muted">المسي الإجابة أولًا، ثم اضغطي تأكيد الإجابة.</p>`}</div><div class="centerbtn"><button class="btn secondary" onclick="pauseGame()">⏸ إيقاف مؤقت</button></div></section>`;if(!state.answered&&!state.paused&&state.seconds>0)runTimer()}
else if(state.page==='stageEnd'){html=`${header('✨ اكتملت '+stages[state.stage].name+'!','عاد بريق الجوهرة إلى قصر الشعراء')}${scores()}<section class="panel center"><div style="font-size:96px">${stages[state.stage].icon}</div><h2>أحسنتن جميعًا!</h2><p>كل مجموعة خاضت تحدي هذه القاعة.</p><button class="btn" onclick="nextStage()">${state.stage===4?'👑 الانتقال إلى التتويج':'🚪 فتح القاعة التالية'}</button></section>`}
else if(state.page==='end'){const rank=[...state.teams].sort((a,b)=>b.score-a.score),max=rank[0].score,winners=rank.filter(t=>t.score===max);html=`<section class="hero center"><div style="font-size:78px">👑</div><h1>استعدتن تاج الشعراء!</h1><h2>${winners.length>1?'تعادل على المركز الأول: '+winners.map(x=>esc(x.name)).join('، '):'المجموعة الفائزة: '+esc(rank[0].name)}</h2><p>تهانينا! لقد اكتشفتن أسرار الغزل الحضري</p></section><section class="panel"><h2>🏆 لوحة النتائج النهائية</h2>${rank.map((t,i)=>`<div class="rank"><strong>${i+1}. <span style="color:${t.color}">●</span> ${esc(t.name)}</strong><b>${t.score} نقطة</b></div>`).join('')}<div class="centerbtn"><button class="btn" onclick="state.page='review';render()">📚 مراجعة التعلم</button><button class="btn secondary" onclick="newGame()">🔁 مباراة جديدة</button></div></section>`;localStorage.removeItem('jawahirGameState')}
else if(state.page==='review'){html=`${header('📚 مراجعة التعلم','ملخص الجواهر الخمس والأسئلة التي عُرضت خلال المباراة')}${stages.map((s,i)=>`<section class="panel"><h2>${s.icon} ${s.name}</h2><p>${s.desc}</p>${state.history.filter(h=>h.stage===i).map(h=>`<details style="margin:8px 0;border-bottom:1px solid #80738a;padding:8px"><summary>${esc(h.question)} (${esc(h.team)}) ${h.correct?'✓':'✕'}</summary><p><b>الإجابة:</b> ${esc(h.answer)}</p><p>${esc(h.explain)}</p></details>`).join('')}</section>`).join('')}<div class="centerbtn"><button class="btn" onclick="newGame()">مباراة جديدة</button></div>`}
else if(state.page==='paused'){html=`<section class="panel center"><h2>⏸ اللعبة متوقفة مؤقتًا</h2><p>يمكنكن استئناف المباراة من حيث توقفتن.</p><button class="btn" onclick="resume()">▶ استئناف</button> <button class="btn ghost" onclick="newGame()">مباراة جديدة</button></section>`}
$('screen').innerHTML=html;saveIfActive()}
function saveIfActive(){if(!['home','setup','end','review'].includes(state.page))save()}function teamFields(){return Array.from({length:state.teamCount},(_,i)=>`<div class="teamrow"><span class="swatch" style="background:${colors[i]}"></span><label>المجموعة ${i+1}</label><input id="team${i}" maxlength="25" value="${['الياقوت','الزمرد','اللؤلؤ','الماس','الفيروز','العقيق'][i]}" aria-label="اسم المجموعة ${i+1}"></div>`).join('')}
function setup(){state.page='setup';render()}function setCount(x){const names=Array.from({length:state.teamCount},(_,i)=>$('team'+i)?.value||'');state.teamCount=+x;$('teamfields').innerHTML=teamFields();names.slice(0,state.teamCount).forEach((n,i)=>{if($('team'+i))$('team'+i).value=n})}function goHome(){state.page='home';render()}
function start(){let names=Array.from({length:state.teamCount},(_,i)=>$('team'+i).value.trim()||('المجموعة '+(i+1)));if(new Set(names).size<names.length){alert('يرجى اختيار أسماء مختلفة للمجموعات');return}state.teams=names.map((name,i)=>({name,score:0,color:colors[i]}));state.stage=0;state.turn=0;state.history=[];state.questions=stages.map(s=>shuffle(s.q).slice(0,state.teamCount).map(q=>({q,options:shuffle(q[2])})));state.page='map';state.paused=false;sound(550,.2);render()}
function openStage(){state.page='question';state.turn=0;state.answered=false;state.showFeedback=false;state.remaining=state.seconds;state.paused=false;render()}
function runTimer(){tick=setInterval(()=>{if(state.paused||state.answered){clearInterval(tick);return}state.remaining--;if($('count'))$('count').textContent='⏳ '+state.remaining+' ثانية';if($('bar'))$('bar').style.width=Math.max(0,state.remaining/state.seconds*100)+'%';if(state.remaining===5)sound(340,.2);if(state.remaining<=0){clearInterval(tick);answer(-1)}if(state.remaining%5===0)save()},1000)}
function chooseAnswer(i){
 if(state.answered||state.paused||state.page!=='question')return;
 state.selected=i;
 document.querySelectorAll('.choice').forEach((btn,j)=>{btn.classList.toggle('selected',j===i);btn.setAttribute('aria-pressed',String(j===i));});
 const confirm=$('confirmAnswer');if(confirm)confirm.disabled=false;
 const hint=$('selectionHint');if(hint)hint.textContent='تم تحديد الإجابة: '+state.questions[state.stage][state.turn].options[i]+' — اضغطي تأكيد الإجابة.';
 save();sound(490,.08);
}
function answer(i){if(state.answered||state.page!=='question'||(i===null||i===undefined))return;clearInterval(tick);let entry=state.questions[state.stage][state.turn],correct=entry.options[i]===entry.q[1],team=state.teams[state.turn%state.teams.length],points=state.stage===4?30:10;if(correct)team.score+=points;state.answered=true;state.selected=i;state.correct=correct;state.showFeedback=true;state.history.push({stage:state.stage,team:team.name,question:entry.q[0],correct,answer:entry.q[1],explain:entry.q[3]});entry.options.forEach((o,j)=>{let b=$('opt'+j);if(!b)return;b.disabled=true;b.classList.add(o===entry.q[1]?'correct':j===i?'wrong':'');});render();sound(correct?750:240,.25);if(correct){const el=document.createElement('div');el.className='spark';el.textContent='✨ 💎 ✨';document.body.appendChild(el);setTimeout(()=>el.remove(),1000)}save()}
function feedbackHTML(){let entry=state.questions[state.stage][state.turn],correct=state.correct,points=state.stage===4?30:10;return `<div class="feedback" role="status"><h3>${correct?'✅ إجابة صحيحة!':'❌ إجابة غير صحيحة'}</h3><p><b>الإجابة الصحيحة:</b> ${esc(entry.q[1])}</p><p>${esc(entry.q[3])}</p><p><b>النقاط المكتسبة:</b> ${correct?points:0}</p><div class="centerbtn"><button class="btn" onclick="advance()">${state.turn===state.teams.length-1?'إنهاء القاعة':'دور المجموعة التالية'} ←</button></div></div>`}
function advance(){if(!state.answered)return;state.turn++;state.answered=false;state.selected=null;state.showFeedback=false;state.remaining=state.seconds;if(state.turn>=state.teams.length){state.turn=state.teams.length-1;state.page='stageEnd'}render()}
function nextStage(){state.stage++;state.turn=0;state.page=state.stage>=5?'end':'map';render()}
function pauseGame(){clearInterval(tick);state.previous=state.page;state.page='paused';state.paused=true;render()}function resume(){state.page=state.previous||'map';state.paused=false;render()}
function newGame(){if(confirm('هل تريدين بدء مباراة جديدة؟ سيُحذف تقدم المباراة الحالية.')){localStorage.removeItem('jawahirGameState');state={...state,page:'setup',teams:[],questions:[],history:[],stage:0,turn:0,answered:false};render()}}
function continueGame(){if(restore())render();else setup()}
render();
</script></body></html>
